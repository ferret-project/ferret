name: CI

on:
  push:
    branches: [main]
    # A release tag builds again, so the release always gets its versioned image — even when its commit was pushed
    # (and built, without the version) before deploy.sh tagged it.
    tags: ["[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"]
  pull_request:

# Read-only unless a job asks for more (the image job writes packages).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The app's English text → ferret-project/ferret-translations (locales/messages.pot), where translators see what's new.
  # Only when the text changed; the deploy key can write to that repo and nothing else.
  translations:
    name: Send the English text to the translations
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ferret/web translations template
      - uses: actions/checkout@v7
        with:
          repository: ferret-project/ferret-translations
          ssh-key: ${{ secrets.TRANSLATIONS_DEPLOY_KEY }}
          path: translations
      - name: Commit the new source text, if it changed
        run: |
          cp apps/web/src/locales/messages.pot translations/locales/messages.pot
          cd translations
          if git diff --quiet; then echo "No text changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Source text from Ferret ${GITHUB_SHA::7}"
          git push

  image:
    name: Build & push image
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags, for the version
      - id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      # arm64 (Apple Silicon, Raspberry Pi, ARM servers): only the native dependencies' install runs emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub too, once the repository variable DOCKERHUB_NAMESPACE (and the secret DOCKERHUB_TOKEN) are set.
      - if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ferret
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ferret,enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          # `latest` and the version only for a release (its tag): what people pull is always a release. A push to main
          # gets `main` and `sha-<commit>` — a self-hoster's pre-release server can run those (FERRET_TAG).
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(steps.version.outputs.version, '-g') }}
      # The translations repo's newest commit: passed to the build, so new translations aren't hidden by the build cache.
      - id: translations
        run: echo "ref=$(git ls-remote https://github.com/ferret-project/ferret-translations.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FERRET_VERSION=${{ steps.version.outputs.version }}
            FERRET_TRANSLATIONS_REF=${{ steps.translations.outputs.ref || 'main' }}
          labels: ${{ steps.meta.outputs.labels }}
          # A software bill of materials and full build provenance, attached to the image (`docker buildx imagetools
          # inspect … --format '{{ json .SBOM }}'`), so anyone can see what's inside and how it was built.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub's page shows the README and a one-line description. Its images and links (HTML and Markdown) have relative
      # paths, which Docker Hub can't follow, so they're made absolute (GitHub's raw files) first.
      - if: vars.DOCKERHUB_NAMESPACE != ''
        run: |
          sed -E \
            -e 's#(src|srcset)="([^":#]+)"#\1="https://raw.githubusercontent.com/${{ github.repository }}/main/\2"#g' \
            -e 's#href="([^":#]+)"#href="https://github.com/${{ github.repository }}/blob/main/\1"#g' \
            -e 's#\]\(([^):#]+)\)#](https://github.com/${{ github.repository }}/blob/main/\1)#g' \
            README.md > "$RUNNER_TEMP/README.dockerhub.md"
      - if: vars.DOCKERHUB_NAMESPACE != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          readme-filepath: ${{ runner.temp }}/README.dockerhub.md
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/ferret
          short-description: Find anything you own — a self-hosted home inventory with a REST API and an MCP server.
          enable-url-completion: true
