<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The status bar matches the header (base-100); appearance.js sets it for Light, Dark or Automatic. -->
    <meta name="theme-color" content="#fdf9f4" />
    <!-- Before anything draws: the chosen appearance (Automatic / Light / Dark). Not a module, so it runs now. -->
    <script src="/appearance.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ferret" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Ferret — find anything you own: a home inventory for your household." />
    <!-- A household's inventory, and the share links made from it, are never for search engines (public/robots.txt too). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Ferret</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
